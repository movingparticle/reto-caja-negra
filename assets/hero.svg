  <circle cx="58" cy="52" r="5" fill="#ff5c57"/>
  <circle cx="76" cy="52" r="5" fill="#ffb000"/>
  <circle cx="94" cy="52" r="5" fill="#39ff14"/>
  <text x="118" y="57" fill="#d7f5c8" font-family="ui-monospace, Consolas, monospace" font-size="14">movingparticle@caja-negra</text>
  <text x="1040" y="57" fill="#7d9a78" font-family="ui-monospace, Consolas, monospace" font-size="12" text-anchor="end">SN-12:00 · UNIT 02</text>
  <rect x="52" y="78" width="1096" height="168" fill="url(#phosphor)" filter="url(#glow)"/>
  <rect x="52" y="78" width="1096" height="10" fill="#ffffff" opacity=".18"/>
  <text x="78" y="128" fill="#07110a" font-family="ui-monospace, Consolas, monospace" font-size="13" letter-spacing="3">FRONTIER BOGOTA 2026 · RETO 2</text>
  <text x="78" y="176" fill="#07110a" font-family="Georgia, serif" font-size="54" font-weight="700">CAJA NEGRA</text>
  <text x="78" y="214" fill="#0b1a0c" font-family="ui-monospace, Consolas, monospace" font-size="16">observe  →  infer  →  replicate   ·   never call the oracle</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="13">
    <rect x="52" y="268" width="340" height="132" fill="url(#plate)" stroke="#1e3a28"/>
    <rect x="52" y="268" width="340" height="1" fill="#d7f5c8" opacity=".2"/>
    <path d="M64 280 h10 v-8" fill="none" stroke="#39ff14" stroke-width="1.4"/>
    <text x="72" y="304" fill="#ffb000">01  //  QUE</text>
    <text x="72" y="334" fill="#7d9a78">Replica determinista.</text>
    <text x="72" y="354" fill="#7d9a78">Status y cuerpo, byte a byte.</text>
    <rect x="430" y="288" width="340" height="132" fill="url(#plate)" stroke="#1e3a28"/>
    <rect x="430" y="288" width="340" height="1" fill="#d7f5c8" opacity=".2"/>
    <path d="M442 300 h10 v-8" fill="none" stroke="#39ff14" stroke-width="1.4"/>
    <text x="450" y="324" fill="#ffb000">02  //  COMO</text>
    <text x="450" y="354" fill="#7d9a78">ISO 7064 Mod 97-10.</text>
    <text x="450" y="374" fill="#7d9a78">Probing, no memorizacion.</text>
    <rect x="808" y="308" width="340" height="116" fill="url(#plate)" stroke="#1e3a28"/>
    <rect x="808" y="308" width="340" height="1" fill="#d7f5c8" opacity=".2"/>
