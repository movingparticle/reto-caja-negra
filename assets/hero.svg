<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Caja Negra, instrumento de observacion">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2420"/>
      <stop offset="1" stop-color="#070a08"/>
    </linearGradient>
    <linearGradient id="phosphor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ffc4"/>
      <stop offset=".42" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#0d6b12"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
