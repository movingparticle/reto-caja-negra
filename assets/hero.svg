      <stop offset="1" stop-color="#0c1210"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#39ff14" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#050706"/>
  <rect x="28" y="24" width="1144" height="412" rx="8" fill="url(#chassis)" stroke="#2a4034" stroke-width="1.5"/>
