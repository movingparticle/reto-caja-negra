name = "caja-negra-reemplazo"
main = "src/worker.mjs"
compatibility_date = "2024-04-05"

[vars]
# No secrets are embedded. Set them before deploying, e.g.:
#   wrangler secret put TEAM_TOKEN
#   wrangler secret put TUTOR_KEY
#   wrangler secret put ALLOWED_TOKENS

[durable_objects]
bindings = [
  { name = "BANKING_DO", class_name = "BankingDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BankingDurableObject"]
